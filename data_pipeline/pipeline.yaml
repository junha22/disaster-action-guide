# Risk-zone pipeline settings (requirement 3.2). Paths are relative to this file.
version: 1
output: ../backend/app/data/risk_zones.geojson

# Points and lines are grown by this radius (metres, EPSG:5179) to become polygons.
# This is the zone itself. The extra avoidance buffer used for routing lives in
# backend/app/config/strategies.yaml (avoid_buffer_m).
default_radius_m:
  underpass:     {Point: 50, LineString: 12}
  flood_history: {Point: 30, LineString: 12}
  riverside:     {LineString: 40}

sources:
  - {reader: seed_json, path: sources/dummy_seed.json}
  # Real data, once downloaded (readers are placeholders in readers.py):
  # - {reader: underpass_csv, path: raw/underpasses.csv}
  # - {reader: flood_trace_shp, path: raw/flood_traces.shp}
  # - {reader: river_centerline, path: raw/rivers.geojson}
